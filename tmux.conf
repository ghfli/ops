# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded"

# Split panes
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Navigate panes with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# New window preserves path
bind c new-window -c "#{pane_current_path}"

# Window numbering from 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Mouse support
set -g mouse on

# Vi mode for copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Longer history
set -g history-limit 50000

# Faster escape (important for neovim)
set -sg escape-time 10

# Focus events (for vim autoread)
set -g focus-events on

# True color
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",tmux-256color:Tc"

# Status bar
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

set -g status-left-length 40
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#89b4fa]"

set -g status-right-length 60
set -g status-right "#[fg=#585b70]%Y-%m-%d  %H:%M #[fg=#89b4fa,bold]#H "

setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=#313244,fg=#89b4fa,bold] #I:#W "

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Message style
set -g message-style "bg=#89b4fa,fg=#1e1e2e"

# Press Prefix + j to prompt you for a window number to join horizontally
bind j command-prompt -p "Join pane from window:"  "join-pane -h -s '%%'"

# Use vim keybindings in copy mode
setw -g mode-keys vi

# Bind 'v' to begin selection as in Vim
bind -T copy-mode-vi v send-keys -X begin-selection

# Bind 'y' to pull the selection into the macOS clipboard via pbcopy
#bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Make sure dragging with mouse also copies to macOS clipboard
#bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Bind 'y' to copy selection to X clipboard and exit copy mode
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# Drag-to-copy with the mouse automatically syncs to X clipboard
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# Toggle real-time pane logging to a file in your home directory
bind H pipe-pane -o "exec cat >>$HOME/'tmux-#S-#W-#I-#P.log'" \; display-message "Toggled logging to $HOME/tmux-#S-#W-#I-#P.log"

# Save the current pane scrollback history to a file
bind P command-prompt -p 'Save pane history to:' -I '~/tmux-#S-#W-#I-#P.sbh' 'capture-pane -S - ; save-buffer %1 ; delete-buffer'

# Save a unique timestamped snapshot of the current visible screen
bind C run-shell 'tmux capture-pane -p > ~/tmux-hardcopy-$(date +%Y%m%d-%H%M%S).txt' \; display-message "Hardcopy saved to home directory"
